name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Felydia.slnx

      - name: Build
        run: dotnet build Felydia.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Felydia.slnx --configuration Release --no-build
